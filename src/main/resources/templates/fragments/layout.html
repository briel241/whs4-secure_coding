<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="site-header">
  <a class="brand" th:href="@{/}">TinyShop</a>
  <nav aria-label="주요 메뉴">
    <a th:href="@{/products}">상품</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}">내 공간</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/conversations}">대화</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/wallet}">포인트</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">관리</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
      <button class="link-button" type="submit">로그아웃</button>
    </form>
  </nav>
</header>
<footer th:fragment="footer" class="site-footer">
  <p><strong>교육용 가상 포인트</strong> · 실제 결제나 금융 서비스가 아니며 실제 금융정보를 수집하지 않습니다.</p>
</footer>
</body>
</html>
