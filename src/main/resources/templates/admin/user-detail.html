<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사용자 상세 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow"><div class="section-heading"><p class="eyebrow">사용자 상세</p><h1 th:text="${user.nickname}"></h1></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p><section class="card stack"><dl class="detail-list"><div><dt>이메일</dt><dd th:text="${user.email}"></dd></div><div><dt>역할</dt><dd th:text="${user.role}"></dd></div><div><dt>상태</dt><dd th:text="${user.status}"></dd></div></dl>
<form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" class="stack"><label>새 상태<select name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == user.status}"></option></select></label><label>조치 사유<textarea name="reason" minlength="5" maxlength="1000" required></textarea></label><button class="button danger" type="submit">상태 변경 및 세션 무효화</button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
