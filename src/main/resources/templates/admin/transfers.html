<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>송금 조회 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">관리자 · 읽기 전용</p><h1>가상 포인트 송금</h1><p>완료 송금과 원장은 수정하거나 삭제할 수 없습니다.</p></div><div class="card audit-row" th:each="t : ${page.content}"><span class="badge" th:text="${t.status}"></span><strong th:text="|${t.sender.nickname} → ${t.recipient.nickname}|"></strong><span th:text="|${#numbers.formatInteger(t.amount,0,'COMMA')} P|"></span><small th:text="${t.completedAt}"></small></div><nav class="pagination" th:if="${page.totalPages > 1}" aria-label="송금 목록 페이지"><a th:if="${page.hasPrevious()}" th:href="@{/admin/transfers(page=${page.number - 1})}">← 이전</a><span th:text="|${page.number + 1} / ${page.totalPages}|"></span><a th:if="${page.hasNext()}" th:href="@{/admin/transfers(page=${page.number + 1})}">다음 →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
