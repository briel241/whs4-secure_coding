<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 관리 상세 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow"><div class="section-heading"><p class="eyebrow">관리자 · 상품 관리</p><h1 th:text="${product.title}"></h1><p>판매자의 원문을 변경하지 않고 공개 상태만 관리합니다.</p></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p><section class="card stack"><dl class="detail-list"><div><dt>판매자</dt><dd th:text="${product.seller.nickname}"></dd></div><div><dt>가격</dt><dd th:text="|${#numbers.formatInteger(product.price,0,'COMMA')}원|"></dd></div><div><dt>판매 상태</dt><dd th:text="${product.saleStatus}"></dd></div><div><dt>공개 상태</dt><dd th:text="${product.moderationStatus}"></dd></div></dl><p class="preline" th:text="${product.description}"></p><form th:action="@{/admin/products/{id}/moderation(id=${product.id})}" method="post" class="stack"><label>새 공개 상태<select name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == product.moderationStatus}"></option></select></label><label>조치 사유<textarea name="reason" minlength="5" maxlength="1000" required></textarea></label><button class="button danger">상태 변경 및 감사 기록</button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
