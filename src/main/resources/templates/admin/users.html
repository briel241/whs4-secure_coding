<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사용자 관리 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">관리자</p><h1>사용자 관리</h1></div><form method="get" th:action="@{/admin/users}" class="card inline-form"><label>닉네임 검색<input name="query" th:value="${query}" maxlength="30"></label><button class="button small">검색</button></form>
<a class="list-card card" th:each="u : ${page.content}" th:href="@{/admin/users/{id}(id=${u.id})}"><div><span class="badge" th:text="${u.status}"></span><h2 th:text="${u.nickname}"></h2><p th:text="|${u.email} · ${u.role}|"></p></div><span>상세 →</span></a><nav class="pagination" th:if="${page.totalPages > 1}" aria-label="사용자 목록 페이지"><a th:if="${page.hasPrevious()}" th:href="@{/admin/users(query=${query},page=${page.number - 1})}">← 이전</a><span th:text="|${page.number + 1} / ${page.totalPages}|"></span><a th:if="${page.hasNext()}" th:href="@{/admin/users(query=${query},page=${page.number + 1})}">다음 →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
