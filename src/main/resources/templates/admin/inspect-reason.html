<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대화 조사 사유 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow"><div class="section-heading"><p class="eyebrow">감사 대상 작업</p><h1>대화 조사 사유</h1><p>대화 열람 사실과 사유가 감사 로그에 기록됩니다.</p></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p><form method="post" th:action="@{/admin/messages/inspect}" class="card stack"><input type="hidden" name="conversationId" th:value="${conversationId}"><label>대화 ID<input th:value="${conversationId}" disabled></label><label>조사 사유<textarea name="reason" minlength="5" maxlength="1000" required></textarea></label><button class="button danger">사유 기록 후 열람</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
