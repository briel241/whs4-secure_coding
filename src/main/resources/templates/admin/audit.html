<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>감사 로그 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">읽기 전용</p><h1>감사 로그</h1><p>관리 조치와 조사 열람 기록은 애플리케이션에서 수정하거나 삭제할 수 없습니다.</p></div><div class="card audit-row" th:each="a : ${page.content}"><span class="badge" th:text="${a.result}"></span><strong th:text="${a.action}"></strong><span th:text="|${a.targetType} / ${a.targetId}|"></span><span th:text="${a.reason}"></span><small th:text="${a.createdAt}"></small></div><div th:if="${page.empty}" class="empty card">감사 기록이 없습니다.</div><nav class="pagination" th:if="${page.totalPages > 1}" aria-label="감사 로그 페이지"><a th:if="${page.hasPrevious()}" th:href="@{/admin/audit(page=${page.number - 1})}">← 이전</a><span th:text="|${page.number + 1} / ${page.totalPages}|"></span><a th:if="${page.hasNext()}" th:href="@{/admin/audit(page=${page.number + 1})}">다음 →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
