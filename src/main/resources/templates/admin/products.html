<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 관리 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">관리자</p><h1>상품 관리</h1><p>관리자는 판매자 내용으로 위장해 수정하지 않고 공개 상태만 관리합니다.</p></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p>
<div class="card admin-row" th:each="p : ${page.content}"><div><span class="badge" th:text="${p.moderationStatus}"></span><h2><a th:href="@{/admin/products/{id}(id=${p.id})}" th:text="${p.title}"></a></h2><p th:text="|${p.seller.nickname} · ${p.saleStatus}|"></p></div><form th:action="@{/admin/products/{id}/moderation(id=${p.id})}" method="post" class="inline-form"><select name="status" aria-label="공개 상태"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == p.moderationStatus}"></option></select><input name="reason" minlength="5" maxlength="1000" placeholder="조치 사유" aria-label="조치 사유" required><button class="button small danger">적용</button></form></div><nav class="pagination" th:if="${page.totalPages > 1}" aria-label="상품 관리 목록 페이지"><a th:if="${page.hasPrevious()}" th:href="@{/admin/products(page=${page.number - 1})}">← 이전</a><span th:text="|${page.number + 1} / ${page.totalPages}|"></span><a th:if="${page.hasNext()}" th:href="@{/admin/products(page=${page.number + 1})}">다음 →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
