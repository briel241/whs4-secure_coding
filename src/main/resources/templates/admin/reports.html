<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신고 큐 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">관리자</p><h1>신고 큐</h1></div><form method="get" class="card inline-form"><label>상태<select name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option></select></label><button class="button small">보기</button></form>
<a class="list-card card" th:each="r : ${page.content}" th:href="@{/admin/reports/{id}(id=${r.id})}"><div><span class="badge" th:text="${r.status}"></span><h2 th:text="${r.reportType.label}"></h2><p th:text="|${r.targetType} · ${r.createdAt}|"></p></div><span>검토 →</span></a><div th:if="${page.empty}" class="empty card">해당 상태의 신고가 없습니다.</div><nav class="pagination" th:if="${page.totalPages > 1}" aria-label="신고 목록 페이지"><a th:if="${page.hasPrevious()}" th:href="@{/admin/reports(status=${selectedStatus},page=${page.number - 1})}">← 이전</a><span th:text="|${page.number + 1} / ${page.totalPages}|"></span><a th:if="${page.hasNext()}" th:href="@{/admin/reports(status=${selectedStatus},page=${page.number + 1})}">다음 →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
