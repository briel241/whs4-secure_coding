<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카테고리 관리 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">관리자</p><h1>카테고리 관리</h1></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p><form th:action="@{/admin/categories}" method="post" class="card inline-form"><input name="name" minlength="2" maxlength="50" placeholder="새 카테고리" required><input type="hidden" name="active" value="true"><input name="reason" minlength="5" maxlength="1000" placeholder="생성 사유" required><button class="button small">생성</button></form>
<form th:each="c : ${categories}" th:action="@{/admin/categories}" method="post" class="card admin-row"><input type="hidden" name="id" th:value="${c.id}"><label>이름<input name="name" th:value="${c.name}" minlength="2" maxlength="50" required></label><label class="check"><input type="checkbox" name="active" value="true" th:checked="${c.active}"> 활성</label><input name="reason" minlength="5" maxlength="1000" placeholder="변경 사유" required><button class="button small">저장</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
