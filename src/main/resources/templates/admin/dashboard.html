<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">운영과 감사</p><h1>관리자 대시보드</h1></div><div class="stats"><div class="card"><strong th:text="${counts.users}"></strong><span>사용자</span></div><div class="card"><strong th:text="${counts.products}"></strong><span>상품</span></div><div class="card"><strong th:text="${counts.openReports}"></strong><span>미처리 신고</span></div><div class="card"><strong th:text="${counts.auditLogs}"></strong><span>감사 기록</span></div></div>
<div class="action-grid"><a class="card action-card" th:href="@{/admin/users}"><strong>사용자 관리</strong><span>계정 상태와 세션을 관리합니다.</span></a><a class="card action-card" th:href="@{/admin/products}"><strong>상품 관리</strong><span>유해 상품을 숨기거나 복원합니다.</span></a><a class="card action-card" th:href="@{/admin/messages}"><strong>대화·메시지 조사</strong><span>사유를 남기고 대화를 조사하거나 메시지를 숨깁니다.</span></a><a class="card action-card" th:href="@{/admin/reports}"><strong>신고 큐</strong><span>신고를 검토하고 처리합니다.</span></a><a class="card action-card" th:href="@{/admin/categories}"><strong>카테고리</strong><span>카테고리를 생성·수정·비활성화합니다.</span></a><a class="card action-card" th:href="@{/admin/transfers}"><strong>송금 내역</strong><span>완료된 가상 포인트 송금을 조회합니다.</span></a><a class="card action-card" th:href="@{/admin/audit}"><strong>감사 로그</strong><span>변경 불가능한 관리 기록을 조회합니다.</span></a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
