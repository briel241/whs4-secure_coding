<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메시지 조사 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">감사 기록됨</p><h1>메시지 조사</h1></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p><div class="card admin-row" th:each="m : ${messages}"><div><span class="badge" th:text="${m.hidden ? 'HIDDEN' : 'VISIBLE'}"></span><strong th:text="${m.sender.nickname}"></strong><p class="preline" th:text="${m.body}"></p></div><form th:action="@{/admin/messages/{id}/moderation(id=${m.id})}" method="post" class="inline-form"><input type="hidden" name="conversationId" th:value="${conversationId}"><input type="hidden" name="hidden" th:value="${!m.hidden}"><input name="reason" minlength="5" maxlength="1000" placeholder="조치 사유" required><button class="button small danger" th:text="${m.hidden ? '복원' : '숨김'}"></button></form></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
