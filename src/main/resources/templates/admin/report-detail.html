<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신고 상세 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow"><div class="section-heading"><p class="eyebrow">신고 검토</p><h1 th:text="${report.reportType.label}"></h1></div><p th:if="${notice}" class="alert success" th:text="${notice}"></p><p th:if="${error}" class="alert danger" th:text="${error}"></p><section class="card stack"><dl class="detail-list"><div><dt>상태</dt><dd th:text="${report.status}"></dd></div><div><dt>대상</dt><dd th:text="|${report.targetType} / ${report.targetId}|"></dd></div></dl><div class="button-row"><a th:if="${report.targetType.name() == 'USER'}" class="button secondary small" th:href="@{/admin/users/{id}(id=${report.targetId})}">사용자 관리에서 확인</a><a th:if="${report.targetType.name() == 'PRODUCT'}" class="button secondary small" th:href="@{/admin/products/{id}(id=${report.targetId})}">상품 관리에서 확인</a><a th:if="${report.targetType.name() == 'MESSAGE'}" class="button secondary small" th:href="@{/admin/messages/inspect(conversationId=${messageConversationId})}">대화 조사 후 확인</a></div><p class="preline" th:text="${report.details}"></p><form th:action="@{/admin/reports/{id}(id=${report.id})}" method="post" class="stack"><label>처리 상태<select name="status"><option th:each="s : ${statuses}" th:if="${s.name() != 'OPEN'}" th:value="${s}" th:text="${s}"></option></select></label><label>처리 사유<textarea name="reason" minlength="5" maxlength="1000" required></textarea></label><button class="button" type="submit">처리 및 감사 기록</button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
