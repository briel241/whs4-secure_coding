<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대화 상세 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow chat-page"><div class="section-heading"><p class="eyebrow">상품 대화</p><h1 th:text="${conversation.product.title}"></h1><p th:text="|${counterparty.nickname}님과의 대화|"></p><a class="button danger small" th:href="@{/reports/new(targetType='USER',targetId=${counterparty.id})}">상대 사용자 신고</a></div>
<section class="card messages" aria-live="polite"><div th:each="message : ${messages}" class="message" th:classappend="${message.sender.id == viewerId ? 'mine' : ''}"><strong th:text="${message.sender.nickname}"></strong><p class="preline" th:text="${message.body}"></p><div class="message-meta"><small th:text="${message.createdAt}"></small><a th:if="${message.sender.id != viewerId}" th:href="@{/reports/new(targetType='MESSAGE',targetId=${message.id})}">메시지 신고</a></div></div><div th:if="${#lists.isEmpty(messages)}" class="empty">아직 메시지가 없습니다. 예의 있는 첫 인사를 건네 보세요.</div></section>
<form th:action="@{/conversations/{id}/messages(id=${conversation.id})}" th:object="${form}" method="post" class="card stack"><div th:if="${#fields.hasGlobalErrors()}" class="alert danger" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div><label>메시지<textarea th:field="*{body}" rows="4" maxlength="1000" required></textarea><small>일반 텍스트만 허용되며, 과도한 전송은 제한됩니다.</small><small class="field-error" th:errors="*{body}"></small></label><button class="button" type="submit">메시지 보내기</button></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
