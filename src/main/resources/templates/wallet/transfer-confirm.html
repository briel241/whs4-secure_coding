<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>송금 확인 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow"><div class="section-heading"><p class="eyebrow">2단계 · 확인</p><h1>송금 내용을 확인하세요</h1></div><section class="confirm-card card"><span>받는 사람</span><strong th:text="${intent.recipient.nickname}"></strong><span>보낼 가상 포인트</span><strong class="confirm-amount" th:text="|${#numbers.formatInteger(intent.amount,0,'COMMA')} P|"></strong><p th:if="${intent.memo}" th:text="|메모: ${intent.memo}|"></p><small th:text="|${intent.expiresAt}까지 유효|"></small></section>
<form th:action="@{/wallet/transfer-intents/{id}/confirm(id=${intent.id})}" th:object="${form}" method="post" class="card stack"><div th:if="${#fields.hasGlobalErrors()}" class="alert danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><p class="alert danger">확인하면 즉시 가상 포인트가 이동합니다. 받는 사람과 금액을 다시 확인하세요.</p><label>현재 비밀번호 재입력<input th:field="*{currentPassword}" type="password" autocomplete="current-password" maxlength="128" required><small class="field-error" th:errors="*{currentPassword}"></small></label><button class="button danger" type="submit">확인하고 보내기</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
