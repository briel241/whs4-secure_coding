<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가상 포인트 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">교육용 · 실제 화폐 아님</p><h1>가상 포인트 지갑</h1><p>결제, 현금화, 환전이 불가능하며 실제 금융정보를 입력하지 않습니다.</p></div><section class="wallet-card"><span>사용 가능 포인트</span><strong th:text="|${#numbers.formatInteger(wallet.balance,0,'COMMA')} P|"></strong><small th:text="|지갑 상태: ${wallet.status}|"></small><div class="button-row"><a class="button light" th:href="@{/wallet/transfer}">포인트 보내기</a><a class="button ghost-light" th:href="@{/wallet/transfers}">전체 내역</a></div></section>
<p class="alert" th:classappend="${reconciliation.matches ? 'success' : 'danger'}" th:text="${reconciliation.matches ? '원장과 지갑 잔액이 일치합니다.' : '원장 대조가 필요합니다. 관리자에게 문의해 주세요.'}"></p><h2>최근 송금</h2><div class="list-card card" th:each="t : ${history}"><div><strong th:text="${t.sender.id == viewerId ? t.recipient.nickname : t.sender.nickname}"></strong><p th:text="${t.sender.id == viewerId ? '보냄' : '받음'}"></p></div><strong th:text="|${t.sender.id == viewerId ? '-' : '+'}${#numbers.formatInteger(t.amount,0,'COMMA')} P|"></strong></div><div th:if="${#lists.isEmpty(history)}" class="empty card">아직 송금 내역이 없습니다.</div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
