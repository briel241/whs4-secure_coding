<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>송금 내역 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">읽기 전용 원장</p><h1>가상 포인트 송금 내역</h1></div><a class="list-card card" th:each="t : ${history}" th:href="@{/wallet/transfers/{id}(id=${t.id})}"><div><span class="badge" th:text="${t.status}"></span><h2 th:text="${t.sender.id == viewerId ? t.recipient.nickname : t.sender.nickname}"></h2><p th:text="${t.completedAt}"></p></div><strong th:text="|${t.sender.id == viewerId ? '-' : '+'}${#numbers.formatInteger(t.amount,0,'COMMA')} P|"></strong></a><div th:if="${#lists.isEmpty(history)}" class="empty card">송금 내역이 없습니다.</div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
