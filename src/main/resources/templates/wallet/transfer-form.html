<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포인트 보내기 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="narrow"><div class="section-heading"><p class="eyebrow">1단계 · 준비</p><h1>가상 포인트 보내기</h1><p>실제 돈이 아닙니다. 받는 사람과 금액을 다음 화면에서 다시 확인합니다.</p></div><form th:action="@{/wallet/transfer-intents}" th:object="${form}" method="post" class="card stack"><div th:if="${#fields.hasGlobalErrors()}" class="alert danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><label>받는 사람 닉네임<input th:field="*{recipientNickname}" maxlength="30" required><small class="field-error" th:errors="*{recipientNickname}"></small></label><label>금액 (P)<input th:field="*{amount}" type="number" min="1" max="1000000" required><small>1회 최대 1,000,000P · 하루 최대 5,000,000P</small><small class="field-error" th:errors="*{amount}"></small></label><label>메모 (선택)<input th:field="*{memo}" maxlength="200"></label><button class="button" type="submit">확인 단계로</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
