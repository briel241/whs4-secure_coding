<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${product.title} · TinyShop|"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section">
<p th:if="${param.updated}" class="alert success">상품을 변경했습니다.</p>
<div class="product-detail"><section class="gallery card"><img th:if="${!#lists.isEmpty(images)}" th:src="@{/images/{key}(key=${images[0].storageKey})}" th:alt="${product.title}"><div th:if="${#lists.isEmpty(images)}" class="product-placeholder large">Tiny<br>Find</div><div class="thumbs" th:if="${images.size() > 1}"><img th:each="image : ${images}" th:src="@{/images/{key}(key=${image.storageKey})}" alt=""></div></section>
<section class="card stack"><div><span class="badge" th:text="${product.saleStatus.label}"></span><span class="badge subtle" th:text="${product.category.name}"></span></div><h1 th:text="${product.title}"></h1><p class="price" th:text="|${#numbers.formatInteger(product.price, 0, 'COMMA')}원|"></p><dl class="detail-list"><div><dt>판매자</dt><dd th:text="${product.seller.nickname}"></dd></div><div><dt>상품 상태</dt><dd th:text="${product.itemCondition.label}"></dd></div><div><dt>거래 방식</dt><dd th:text="${product.tradeMethod.label}"></dd></div><div><dt>지역</dt><dd th:text="${product.tradeRegion ?: '협의'}"></dd></div></dl>
<div sec:authorize="isAuthenticated()" th:unless="${owner}" class="button-row"><form th:action="@{/products/{id}/conversations(id=${product.id})}" method="post"><button class="button" type="submit">판매자와 대화</button></form><a class="button secondary" th:href="@{/reports/new(targetType='PRODUCT',targetId=${product.id})}">상품 신고</a><a class="button danger" th:href="@{/reports/new(targetType='USER',targetId=${product.seller.id})}">판매자 신고</a></div>
<div th:if="${owner}" class="stack"><a class="button" th:href="@{/products/{id}/edit(id=${product.id})}">상품 수정</a><form th:action="@{/products/{id}/status(id=${product.id})}" method="post" class="inline-form"><label>판매 상태<select name="status"><option th:each="s : ${T(com.tinyshop.product.domain.SaleStatus).values()}" th:if="${s.name() != 'DELETED'}" th:value="${s}" th:text="${s.label}" th:selected="${s == product.saleStatus}"></option></select></label><button class="button secondary" type="submit">상태 변경</button></form><form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" class="danger-zone"><button class="button danger" type="submit">상품 삭제</button></form></div></section></div>
<section class="card description"><h2>상품 설명</h2><p class="preline" th:text="${product.description}"></p></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
