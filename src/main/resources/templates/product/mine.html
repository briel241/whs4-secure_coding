<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 상품 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading inline-heading"><div><p class="eyebrow">판매 관리</p><h1>내 상품</h1></div><a class="button" th:href="@{/products/new}">새 상품</a></div><p th:if="${param.deleted}" class="alert success">상품을 소프트 삭제했습니다.</p>
<div class="list-card card" th:each="product : ${page.content}"><div><span class="badge" th:text="${product.saleStatus.label}"></span><h2 th:text="${product.title}"></h2><p th:text="|${#numbers.formatInteger(product.price,0,'COMMA')}원 · ${product.updatedAt}|"></p></div><div class="button-row"><a class="button small secondary" th:href="@{/products/{id}(id=${product.id})}">보기</a><a class="button small" th:if="${product.saleStatus.name() != 'DELETED'}" th:href="@{/products/{id}/edit(id=${product.id})}">수정</a></div></div><div th:if="${page.empty}" class="empty card">등록한 상품이 없습니다.</div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
