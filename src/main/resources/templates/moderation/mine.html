<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 신고 · TinyShop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container section"><div class="section-heading"><p class="eyebrow">처리 현황</p><h1>내 신고</h1></div><p th:if="${param.created}" class="alert success">신고를 접수했습니다.</p>
<div class="list-card card" th:each="r : ${reports}"><div><span class="badge" th:text="${r.status}"></span><h2 th:text="${r.reportType.label}"></h2><p th:text="|${r.targetType} · ${r.createdAt}|"></p></div><p th:if="${r.resolutionReason}" th:text="${r.resolutionReason}"></p></div><div th:if="${#lists.isEmpty(reports)}" class="empty card">접수한 신고가 없습니다.</div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
