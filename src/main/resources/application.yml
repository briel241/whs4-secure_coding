spring:
  application:
    name: tinyshop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tinyshop}
    username: ${DB_USERNAME:tinyshop}
    password: ${DB_PASSWORD:local-dev-password}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_updates: true
        order_inserts: true
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 22MB
  mvc:
    hiddenmethod:
      filter:
        enabled: false
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_SECURE:false}
        same-site: lax
app:
  upload:
    directory: ${UPLOAD_DIR:./var/uploads}
    max-file-bytes: 5242880
    max-pixels: 24000000
    max-width: 8000
    max-height: 8000
  security:
    login-max-failures: 5
    login-lock-minutes: 15
  message:
    rate-limit-count: 10
    rate-limit-window-seconds: 30
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN:false}
    email: ${APP_ADMIN_EMAIL:}
    nickname: ${APP_ADMIN_NICKNAME:관리자}
    password: ${APP_ADMIN_PASSWORD:}
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
