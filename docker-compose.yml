services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: tinyshop
      POSTGRES_USER: tinyshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tinyshop-postgres17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyshop -d tinyshop"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  tinyshop-postgres17:
